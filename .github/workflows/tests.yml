# Runs the addon's and the app's tests on every change. Read-only: no secrets, nothing
# published, and pull requests from forks get no write access.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
      - run: python -m pytest -q tests
